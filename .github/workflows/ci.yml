# CI quality gates. Runs on every PR and on main pushes.
#
# Scope notes:
# - The candle layer (backend/src/assets candle files, providers/kis/candles,
#   candle-related providers/binance files, realtime live-candle files, and
#   the candle smoke scripts) is a REQUIRED lint/format gate
#   (lint:candles:check / format:candles:check). The rest of the repository
#   has known pre-existing lint debt and is deliberately not gated yet.
# - Long real-provider smokes (Binance/KIS WebSocket+REST) are NEVER run in
#   CI; they are a manual runbook step (see
#   backend/docs/candle-live-operations.md). Only the fixture smoke — real
#   PostgreSQL + Redis with in-process fixture providers, no provider
#   credentials — runs here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        # prisma.config.ts resolves the datasource url from env("DATABASE_URL")
        # while loading config, so `prisma generate` aborts when it is unset —
        # even though no database is contacted here. A syntactically valid,
        # non-secret placeholder satisfies the resolver; it is scoped to this
        # step so the rest of the Backend quality job never sees a DATABASE_URL
        # (this job has no PostgreSQL service and must not appear to have a DB).
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma?schema=public
      - name: Candle-layer lint (check only, no fix)
        run: pnpm run lint:candles:check
      - name: Candle-layer format check
        run: pnpm run format:candles:check
      # The trading-account layer (accounts, ad rewards, and the account-scoped
      # portfolio/orders/FX/wallets/positions controllers) is the second gated
      # area. Product files only: the repo's pre-existing lint debt is almost
      # entirely `no-unsafe-*` in spec files, and gating those would mean fixing
      # ~900 unrelated errors before this rule could protect anything.
      - name: Trading-account layer lint (check only, no fix)
        run: pnpm run lint:accounts:check
      - name: Production typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm test

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (frozen lockfile)
        run: npm ci
      # The account/auth/order/FX/home product files are the gated frontend
      # scope (작업 12 §6) — the same "product files only, known-clean area"
      # rule the backend's candle and trading-account gates follow. Warnings
      # fail (--max-warnings=0) and nothing is auto-fixed (--no-fix): a gate
      # that repairs the tree cannot tell you the tree was broken.
      - name: Account/auth layer lint (check only, no fix)
        run: npm run lint:accounts:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (node --test, Node 24 type stripping)
        run: npm test
      # The production compile gate for the app itself. `tsc --noEmit` proves
      # the types; only a bundle proves that every module actually resolves and
      # that the app can be built — which is what ships.
      - name: Web export (production bundle)
        run: npm run export:web

  limit-order-db-integration:
    name: Limit order PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading_app
          POSTGRES_PASSWORD: trading_app_pw
          POSTGRES_DB: trading_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://trading_app:trading_app_pw@localhost:5432/trading_app?schema=public
      REDIS_URL: redis://localhost:6379
      # Opt-in switch for the money-layer limit-order suites: reservation
      # atomicity, deterministic races, post-lock time boundaries, no-Redis
      # registration.
      LIMIT_ORDER_RESERVATION_DB_INTEGRATION: "1"
      # Idempotent replay of a COMMITTED limit create: ahead of the feature
      # flag and the create-service wiring, resolving to the caller's own order
      # even when the same key was reused in another season, and never
      # producing a second order or a second cash reservation.
      LIMIT_ORDER_IDEMPOTENT_REPLAY_INTEGRATION: "1"
      # Scheduler-based matching (paths A/B): fill price (snapshot vs limit),
      # pinned reservation fee, first-eligible/partial-candle exclusion,
      # cancel-vs-fill, ended-season, and candle-evidence isolation.
      LIMIT_ORDER_MATCHING_DB_INTEGRATION: "1"
      ORDER_EXECUTE_DB_INTEGRATION: "1"
      FX_EXECUTE_DB_INTEGRATION: "1"
      MVP_FLOW_DB_SMOKE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      # Also proves every migration — including the additive event-layer
      # migrations and the cleanup migration that removes that layer again —
      # applies cleanly to a fresh database.
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
      - name: Verify migrations are fully applied
        run: pnpm exec prisma migrate status
      # Schema drift gate: the deployed database must express EXACTLY what
      # schema.prisma declares (index names pinned with `map:` included).
      # --exit-code returns 2 on any difference, failing the job.
      - name: Verify no schema drift against the deployed database
        run: >-
          pnpm exec prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code
      # Reservation atomicity, deterministic lock interleavings, post-lock DB
      # time boundaries, no-Redis registration, idempotent create replay, and
      # the scheduler-based matcher (paths A/B: fill price, pinned fee,
      # partial-candle exclusion, cancel-vs-fill, ended season, evidence
      # isolation).
      - name: Limit order PostgreSQL integration tests
        run: >-
          pnpm exec jest --runInBand
          src/orders/limit-order-reservation.integration.spec.ts
          src/orders/limit-order-create-race.integration.spec.ts
          src/orders/limit-order-transaction-time.integration.spec.ts
          src/orders/limit-order-create-no-redis.integration.spec.ts
          src/orders/limit-order-idempotent-replay.integration.spec.ts
          src/orders/limit-order-matching.integration.spec.ts
          src/orders/orders.execute.integration.spec.ts
          src/fx/fx.execute.integration.spec.ts
          src/mvp-flow.integration.spec.ts

  core-account-db-integration:
    name: Core account PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading_app
          POSTGRES_PASSWORD: trading_app_pw
          POSTGRES_DB: trading_app
          # UTC is not cosmetic: Prisma reads `timestamptz` against the server
          # zone, and a KST server shifts every stored instant by nine hours,
          # which silently moves snapshot and settlement boundaries.
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://trading_app:trading_app_pw@localhost:5432/trading_app?schema=public
      REDIS_URL: redis://localhost:6379
      # Ownership, participant↔account linkage, financial scope, trading scope,
      # general-account creation and initial grant, snapshot/ranking scope.
      TRADING_ACCOUNT_DB_INTEGRATION: "1"
      # Complete general trading lifecycle: KRW market buy, market sell,
      # limit buy/sell reservations, cancel/release, matcher fill/skip, TWR,
      # account isolation, and injected trading-scope corruption.
      GENERAL_TRADING_DB_INTEGRATION: "1"
      # Complete general KRW/USD FX lifecycle and its account/TWR integrity.
      GENERAL_FX_DB_INTEGRATION: "1"
      SEASON_JOIN_DB_INTEGRATION: "1"
      # Feature flags the account-scoped suites assert THROUGH; they gate
      # product behaviour, not the tests.
      LIMIT_ORDER_ENABLED: "true"
      AD_REWARD_ENABLED: "true"
      AUTH_DB_SMOKE: "1"
      OPS_JOB_LOCK_DB_SMOKE: "1"
      JWT_ACCESS_SECRET: ci-core-account-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
      - name: Verify migrations are fully applied
        run: pnpm exec prisma migrate status
      # The deployed database must express EXACTLY what schema.prisma declares,
      # index names included (they are pinned with `map:` where a migration
      # named them explicitly). --exit-code returns 2 on any difference.
      - name: Verify no schema drift against the deployed database
        run: >-
          pnpm exec prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code
      # Serially: these suites share one database, and running them in parallel
      # makes them fail on each other's fixtures rather than on real defects.
      - name: Core account integration tests
        run: >-
          pnpm exec jest --runInBand
          src/seasons/trading-account.integration.spec.ts
          src/seasons/trading-account-link.integration.spec.ts
          src/seasons/trading-account-financial-scope.integration.spec.ts
          src/seasons/trading-account-trading-scope.integration.spec.ts
          src/trading-accounts/general-account.integration.spec.ts
          src/orders/general-account-trading.integration.spec.ts
          src/fx/general-account-fx.integration.spec.ts
          src/orders/order-replay-and-cancel-scope.integration.spec.ts
          src/portfolio/general-performance-hardening.integration.spec.ts
          src/portfolio/snapshot-scope-audit.integration.spec.ts
          src/trading-accounts/general-trading-audit.integration.spec.ts
          src/ranking/season-ranking-scope.integration.spec.ts
          src/seasons/seasons.join.integration.spec.ts
          src/auth/auth.integration.spec.ts
          src/ops/ops-job-lock.integration.spec.ts
      # The operational tools must report a clean database as clean, and must
      # not write while doing so. Damage DETECTION is covered by the integration
      # suites above (which inject it); this is the "0 findings means 0" half.
      - name: Repair and audit tools (dry-run, no writes)
        run: |
          set -e
          pnpm run trading-accounts:repair-links
          pnpm run trading-accounts:repair-financial-scope
          pnpm run trading-accounts:repair-trading-scope
          pnpm run trading-accounts:repair-snapshot-scope
          pnpm run trading-accounts:repair-ranking-scope
          pnpm run trading-accounts:audit-general

  release-critical-e2e:
    name: Release-critical E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma?schema=public
      # The canonical release-critical command. It takes NO environment
      # variables on purpose: the suite signs its tokens with the secret the
      # application itself resolves, and pins the scheduler/calendar inputs it
      # depends on. A suite that needs an undocumented variable is a suite whose
      # result depends on whose machine it ran on.
      - name: Canonical e2e (no environment variables)
        run: pnpm run test:e2e

  candle-fixture-integration:
    name: Candle fixture integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading_app
          POSTGRES_PASSWORD: trading_app_pw
          POSTGRES_DB: trading_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://trading_app:trading_app_pw@localhost:5432/trading_app?schema=public
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
      # Record the fixture artifacts that already exist at checkout (historical
      # results committed to the repo). This run's artifact is identified later
      # as the set difference — never by modification time, which cannot tell a
      # freshly checked-out historical file apart from one written just now.
      - name: Snapshot pre-existing fixture artifacts
        run: |
          shopt -s nullglob
          : > "$RUNNER_TEMP/pre-fixtures.txt"
          for f in artifacts/candle-smoke/fixture-*.json; do
            basename "$f" >> "$RUNNER_TEMP/pre-fixtures.txt"
          done
          echo "pre-existing fixture artifacts at checkout:"
          cat "$RUNNER_TEMP/pre-fixtures.txt"
      - name: Run release fixture smoke (no provider credentials)
        run: CANDLE_PIPELINE_RELEASE_FIXTURE_SMOKE=1 pnpm run smoke:candle-fixture
      # Identify exactly the fixture JSON this run produced (files not present at
      # checkout). Runs on success and failure so a smoke that wrote a report
      # before failing still yields one debuggable file — but never falls back
      # to a historical artifact, and never masks the smoke's own exit status.
      - name: Identify this run's fixture artifact
        id: fixture
        if: always()
        run: |
          shopt -s nullglob
          new=""
          for f in artifacts/candle-smoke/fixture-*.json; do
            name="$(basename "$f")"
            if grep -qxF "$name" "$RUNNER_TEMP/pre-fixtures.txt" 2>/dev/null; then
              continue
            fi
            if [ -n "$new" ]; then
              echo "more than one new fixture artifact appeared this run: $new and $f" >&2
              exit 1
            fi
            new="$f"
          done
          if [ -z "$new" ]; then
            echo "no new fixture artifact was produced this run; nothing to upload"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "this run's fixture artifact: $new"
          echo "found=true" >> "$GITHUB_OUTPUT"
          # relpath is backend-relative (run steps default to working-directory:
          # backend); path is repo-root-relative for upload-artifact, whose
          # action step does NOT honor defaults.run.working-directory.
          echo "relpath=$new" >> "$GITHUB_OUTPUT"
          echo "path=backend/$new" >> "$GITHUB_OUTPUT"
      # Release gate: only reached when the smoke itself passed. Asserts the one
      # file this run produced proves the checked-out commit, a clean tree, and
      # a passed result. A failed smoke skips this step (its exit status wins).
      - name: Verify artifact commit traceability
        run: |
          rel="${{ steps.fixture.outputs.relpath }}"
          if [ -z "$rel" ]; then
            echo "no fixture artifact produced this run to verify" >&2
            exit 1
          fi
          echo "verifying $rel"
          jq -e --arg sha "$GITHUB_SHA" \
            '.gitCommit == $sha and .gitDirty == false and .result == "passed"' \
            "$rel"
      - name: Upload this run's fixture artifact (kept on failure too)
        if: always() && steps.fixture.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candle-fixture-smoke
          path: ${{ steps.fixture.outputs.path }}
          if-no-files-found: error
