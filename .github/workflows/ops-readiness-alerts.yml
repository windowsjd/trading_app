# Operator alert delivery for the production backend, using only GitHub.
#
# Polls the public `GET /readiness/alerts` (HTTP 503 while an operator alert
# code is active; see backend/docs/database-operations-monitoring.md) and keeps
# ONE open issue labelled `ops-alert` while alerts persist. GitHub notifies the
# repository's watchers when the issue opens, on each comment and on close:
# - opened once when the same alert is seen in two checks a minute apart;
# - one comment only when the set of codes changes (no repeat per run);
# - closed when two checks a minute apart both answer 200.
#
# Inert until the repository variable OPS_READINESS_ALERTS_URL is set
# (Settings → Secrets and variables → Actions → Variables), e.g.
# https://<service>.onrender.com/readiness/alerts. Scheduled runs execute only
# from the default branch and GitHub may delay them: this is a backstop for
# conditions that last minutes or longer, not a seconds-level pager.
name: Ops readiness alerts

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ops-readiness-alerts
  cancel-in-progress: false

jobs:
  check:
    name: Check production /readiness/alerts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ vars.OPS_READINESS_ALERTS_URL }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Poll twice and open, update or close the alert issue
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::notice::OPS_READINESS_ALERTS_URL is not set; alert delivery is inactive."
            exit 0
          fi
          # One check → comma-separated alert codes, empty when healthy.
          check() {
            local http
            if ! http=$(curl -sS -o body.json -w '%{http_code}' --max-time 30 "$URL"); then
              echo "READINESS_UNREACHABLE"
            elif [ "$http" = "200" ]; then
              echo ""
            else
              local codes
              codes=$(jq -r '(.data.alerts // []) | join(",")' body.json 2>/dev/null || true)
              echo "${codes:-READINESS_HTTP_${http}}"
            fi
          }
          first=$(check)
          sleep 60
          second=$(check)
          # Only codes present in both checks count; a one-minute blip does not.
          alerts=$(comm -12 <(tr ',' '\n' <<<"$first" | sed '/^$/d' | sort -u) \
                            <(tr ',' '\n' <<<"$second" | sed '/^$/d' | sort -u) | paste -sd, -)
          echo "first=[${first}] second=[${second}] persistent=[${alerts}]"
          open=$(gh issue list --label ops-alert --state open --json number,body --limit 1)
          number=$(jq -r '.[0].number // empty' <<<"$open")
          now=$(date -u +%FT%TZ)
          if [ -z "$alerts" ]; then
            if [ -n "$number" ] && [ -z "$first" ] && [ -z "$second" ]; then
              gh issue close "$number" --comment "Cleared at ${now}: /readiness/alerts answered 200 twice."
            fi
            exit 0
          fi
          marker="<!-- ops-alert-codes: ${alerts} -->"
          body="Production \`/readiness/alerts\` reports: **${alerts}** (since ${now}, seen twice a minute apart).

          What each code means and what to do: backend/docs/database-operations-monitoring.md (§4).
          This issue closes itself when the endpoint answers 200 again.

          ${marker}"
          if [ -z "$number" ]; then
            gh label create ops-alert --color B60205 --description "Production readiness alert (automated)" 2>/dev/null || true
            gh issue create --label ops-alert --title "Ops alert: ${alerts}" --body "$body"
          elif ! jq -r '.[0].body' <<<"$open" | grep -qF "$marker"; then
            gh issue comment "$number" --body "Alert codes changed at ${now}: **${alerts}**"
            gh issue edit "$number" --title "Ops alert: ${alerts}" --body "$body"
          fi
