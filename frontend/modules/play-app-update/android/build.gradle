// Local Expo module (autolinked from frontend/modules): Google Play In-App
// Updates, read-only (does Play offer this install a newer version?).
// https://developer.android.com/guide/playcore/in-app-updates
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.nanghwa.tradingclass'
version = '1.0.0'

android {
  namespace "expo.modules.playappupdate"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.google.android.play:app-update:2.1.0'
}
